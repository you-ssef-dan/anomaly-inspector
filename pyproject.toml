[project]
name = "anomaly-inspector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "you-ssef-dan", email = "youssefdanoun02@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
anomaly-inspector = "anomaly_inspector:main"

[project.optional-dependencies]
train = [
    "dvc[s3]>=3.67.1",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "onnxscript>=0.7.2",
    "pandas>=3.1.0",
    "pandera>=0.34.1",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]
serve = [
    "fastapi>=0.159.1",
    "onnxruntime>=1.31.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]
bench = [
    "anomalib>=2.7.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["guides"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "NPY", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]  # teaches mypy that Field(100, ...) is a default value
# Some Tensor methods (backward, split) have no annotations yet; calling them is still allowed.
untyped_calls_exclude = ["torch"]

[[tool.mypy.overrides]]
module = ["torchvision.*", "timm.*", "scipy.*", "sklearn.*", "mlflow.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=anomaly_inspector --cov-report=term-missing"
markers = [
  "slow: needs the real dataset or takes more than a few seconds",
  "integration: needs Docker, the network or a real exported model",
]

[tool.coverage.report]
fail_under = 80

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.5",
    "ipykernel>=7.4.0",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]
