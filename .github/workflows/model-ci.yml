name: model-ci
# On pull requests that can change a model: re-run the DVC stages the change affects, post the
# params and metrics diff against main as a comment, then run the quality gate (gates.yaml).
# Data and models come from DagsHub, with the DAGSHUB_TOKEN secret.
# It runs on every pull request, so `pipeline` can be a required check: without an ML change it
# passes in seconds. (A `paths:` filter would leave it unreported, and a required check that
# never reports blocks the merge.)
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write  # the comment
concurrency:
  group: model-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # DVC reads S3-style credentials from these; DagsHub takes its token as both.
      AWS_ACCESS_KEY_ID: ${{ secrets.DAGSHUB_TOKEN }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DAGSHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the diff compares with main
      # HEAD is the pull request merged into main, so HEAD^1 is main: the diff is this PR.
      - name: Does this pull request change ML code, params, data or dependencies?
        id: changes
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          pattern='^(src/anomaly_inspector/|params\.yaml$|gates\.yaml$|dvc\.(yaml|lock)$|data/.*\.dvc$|\.dvc/config$|pyproject\.toml$|uv\.lock$|\.github/workflows/model-ci\.yml$)'
          if grep -qE "$pattern" <<< "$changed"; then
            echo "ml=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ML change: nothing to re-run, the gate stands."
          fi
      - if: steps.changes.outputs.ml == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - if: steps.changes.outputs.ml == 'true'
        run: uv sync --locked --extra train
      # The images too: the stages read them through the manifest, so they are not declared
      # inputs and `dvc repro --pull` would not fetch them.
      - if: steps.changes.outputs.ml == 'true'
        run: uv run dvc pull data/raw/mvtec_ad.dvc dvc.yaml
      - if: steps.changes.outputs.ml == 'true'
        run: uv run dvc repro  # only the stages this pull request changed run again
      - name: Comment the params and metrics diff
        if: steps.changes.outputs.ml == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # DVC prints an empty table (2 lines) when nothing changed
          table() { local md; md=$("$@"); if [ "$(wc -l <<< "$md")" -gt 2 ]; then echo "$md"; else echo "No change."; fi; }
          {
            echo "### Model CI against main"
            echo
            echo "**Params**"
            echo
            table uv run dvc params diff origin/main --md
            echo
            echo "**Metrics** (after \`dvc repro\` on this pull request)"
            echo
            table uv run dvc metrics diff origin/main --md --precision 4
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md \
            --edit-last --create-if-none
      - if: steps.changes.outputs.ml == 'true'
        run: uv run python -m anomaly_inspector.pipelines.gate
