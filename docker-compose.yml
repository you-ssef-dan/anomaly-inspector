services:
  mlflow-db:  # not "postgres": Airflow's Compose file already uses that name
    image: postgres:17
    profiles: [mlflow]
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: mlflow
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      retries: 10

  mlflow:
    build: {context: docker, dockerfile: mlflow.Dockerfile}
    profiles: [mlflow]
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://mlflow:${POSTGRES_PASSWORD}@mlflow-db:5432/mlflow
      --artifacts-destination /mlartifacts
      --allowed-hosts "localhost:*,127.0.0.1:*,mlflow:*"
    # No background job workers: they run MLflow's GenAI jobs (scorers, prompt optimisation),
    # which this project does not use, and took about 1.5 GB (7 processes) next to Airflow.
    environment: {MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"}
    ports: ["127.0.0.1:5000:5000"]
    volumes: [mlartifacts:/mlartifacts]
    depends_on:
      mlflow-db: {condition: service_healthy}
    healthcheck:  # the image has no curl; Python is there
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      start_period: 30s
      retries: 5

  # The inspection API: one category's ONNX model behind FastAPI (docker/api.Dockerfile).
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args: {MODEL_FILE: models/patchcore/bottle/model.onnx}  # which category this API serves
    image: anomaly-inspector-api
    profiles: [api]
    ports: ["127.0.0.1:8000:8000"]
    # The size of a small cloud instance, so local latency and memory mean something. On this
    # laptop, 2 CPUs' worth of time also lands on its slow efficiency cores: expect it slower here
    # than on a server, whose cores are all alike.
    deploy:
      resources:
        limits: {cpus: "2", memory: 1g}

  # Monitoring: Prometheus reads the API's /metrics every 15 s and keeps the history, Grafana
  # draws it. Both are set up from monitoring/, so a fresh clone gets the same dashboards.
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [monitoring]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - promdata:/prometheus  # the history survives a restart

  grafana:
    image: grafana/grafana:13.2.5
    profiles: [monitoring]
    ports: ["127.0.0.1:3000:3000"]
    # No volume of its own: the data source and the dashboards are read from monitoring/grafana
    # at each start, and what they show lives in Prometheus. Only the folders we fill are mounted:
    # hiding the image's other (empty) provisioning folders makes Grafana log errors.
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      # Only this machine can open it: viewing needs no login, editing needs the admin one.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/anomaly-inspector.json

networks:
  default:
    name: inspection  # Airflow joins this network in Phase 9

volumes:
  pgdata:
  mlartifacts:
  promdata:
