services:
  mlflow-db:  # not "postgres": Airflow's Compose file already uses that name
    image: postgres:17
    profiles: [mlflow]
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: mlflow
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      retries: 10

  mlflow:
    build: {context: docker, dockerfile: mlflow.Dockerfile}
    profiles: [mlflow]
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://mlflow:${POSTGRES_PASSWORD}@mlflow-db:5432/mlflow
      --artifacts-destination /mlartifacts
      --allowed-hosts "localhost:*,127.0.0.1:*,mlflow:*"
    ports: ["127.0.0.1:5000:5000"]
    volumes: [mlartifacts:/mlartifacts]
    depends_on:
      mlflow-db: {condition: service_healthy}
    healthcheck:  # the image has no curl; Python is there
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      start_period: 30s
      retries: 5

  # The inspection API: one category's ONNX model behind FastAPI (docker/api.Dockerfile).
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args: {MODEL_FILE: models/patchcore/bottle/model.onnx}  # which category this API serves
    image: anomaly-inspector-api
    profiles: [api]
    ports: ["127.0.0.1:8000:8000"]
    # The size of a small cloud instance, so local latency and memory mean something. On this
    # laptop, 2 CPUs' worth of time also lands on its slow efficiency cores: expect it slower here
    # than on a server, whose cores are all alike.
    deploy:
      resources:
        limits: {cpus: "2", memory: 1g}

networks:
  default:
    name: inspection  # Airflow joins this network in Phase 9

volumes:
  pgdata:
  mlartifacts:
