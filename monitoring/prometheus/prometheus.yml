# What Prometheus collects: the API's /metrics, every 15 seconds. The API's counters only go up;
# Prometheus stores each reading with its time, so rates and percentiles can be computed later.
global:
  scrape_interval: 15s  # Grafana's data source is told the same interval
  evaluation_interval: 1m  # how often the alert rules are checked

rule_files: [alerts.yml]  # relative to this file; after a change, make monitoring-up

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]  # the Compose service, on the inspection network
