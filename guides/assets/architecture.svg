<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" width="760" height="512" role="img" aria-label="Every change reaches production through a pull request and its gates" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
<title>Every change reaches production through a pull request and its gates</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a978d"/></marker></defs>
<rect width="760" height="512" rx="12" fill="#ffffff"/>
<text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">Every change reaches production through a pull request and its gates</text>
<rect x="24" y="48" width="712" height="120" rx="8" fill="none" stroke="#dcd9d0" stroke-width="1.25"/>
<text x="720" y="70" text-anchor="end" font-weight="600" fill="#5f6368">Build and track, on your laptop</text>
<rect x="24" y="208" width="712" height="120" rx="8" fill="none" stroke="#dcd9d0" stroke-width="1.25"/>
<text x="720" y="230" text-anchor="end" font-weight="600" fill="#5f6368">Ship, on GitHub and the cloud</text>
<rect x="24" y="368" width="712" height="120" rx="8" fill="none" stroke="#dcd9d0" stroke-width="1.25"/>
<text x="720" y="390" text-anchor="end" font-weight="600" fill="#5f6368">Operate, in Docker Compose</text>
<rect x="40" y="80" width="200" height="72" rx="8" fill="none" stroke="#b5b2a8" stroke-width="1.25"/>
<text x="140" y="104" text-anchor="middle" font-weight="600" fill="#1f1f1f">Versioned data</text>
<text x="140" y="120" text-anchor="middle" font-size="11.5" fill="#5f6368">MVTec AD images in DVC</text>
<text x="140" y="136" text-anchor="middle" font-size="11.5" fill="#5f6368">remote: Cloudflare R2</text>
<rect x="280" y="80" width="200" height="72" rx="8" fill="none" stroke="#b5b2a8" stroke-width="1.25"/>
<text x="380" y="104" text-anchor="middle" font-weight="600" fill="#1f1f1f">DVC pipeline</text>
<text x="380" y="120" text-anchor="middle" font-size="11.5" fill="#5f6368">prepare, train, evaluate</text>
<text x="380" y="136" text-anchor="middle" font-size="11.5" fill="#5f6368">and export to ONNX</text>
<rect x="520" y="80" width="200" height="72" rx="8" fill="none" stroke="#b5b2a8" stroke-width="1.25"/>
<text x="620" y="104" text-anchor="middle" font-weight="600" fill="#1f1f1f">MLflow</text>
<text x="620" y="120" text-anchor="middle" font-size="11.5" fill="#5f6368">runs, metrics, registry</text>
<text x="620" y="136" text-anchor="middle" font-size="11.5" fill="#5f6368">champion and challenger</text>
<rect x="40" y="240" width="152" height="72" rx="8" fill="none" stroke="#b5b2a8" stroke-width="1.25"/>
<text x="116" y="264" text-anchor="middle" font-weight="600" fill="#1f1f1f">Pull request</text>
<text x="116" y="280" text-anchor="middle" font-size="11.5" fill="#5f6368">code, params and</text>
<text x="116" y="296" text-anchor="middle" font-size="11.5" fill="#5f6368">dvc.lock changes</text>
<rect x="216" y="240" width="152" height="72" rx="8" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6" stroke-width="2"/>
<text x="292" y="264" text-anchor="middle" font-weight="600" fill="#1f1f1f">GitHub Actions</text>
<text x="292" y="280" text-anchor="middle" font-size="11.5" fill="#1f1f1f">tests, model gates</text>
<text x="292" y="296" text-anchor="middle" font-size="11.5" fill="#1f1f1f">and image scan</text>
<rect x="392" y="240" width="152" height="72" rx="8" fill="none" stroke="#b5b2a8" stroke-width="1.25"/>
<text x="468" y="264" text-anchor="middle" font-weight="600" fill="#1f1f1f">GHCR image</text>
<text x="468" y="280" text-anchor="middle" font-size="11.5" fill="#5f6368">FastAPI and ONNX</text>
<text x="468" y="296" text-anchor="middle" font-size="11.5" fill="#5f6368">Runtime, no torch</text>
<rect x="568" y="240" width="152" height="72" rx="8" fill="none" stroke="#b5b2a8" stroke-width="1.25"/>
<text x="644" y="264" text-anchor="middle" font-weight="600" fill="#1f1f1f">Cloud Run</text>
<text x="644" y="280" text-anchor="middle" font-size="11.5" fill="#5f6368">live API and</text>
<text x="644" y="296" text-anchor="middle" font-size="11.5" fill="#5f6368">demo page</text>
<rect x="40" y="400" width="152" height="72" rx="8" fill="none" stroke="#b5b2a8" stroke-width="1.25"/>
<text x="116" y="424" text-anchor="middle" font-weight="600" fill="#1f1f1f">Simulated line</text>
<text x="116" y="440" text-anchor="middle" font-size="11.5" fill="#5f6368">new part images</text>
<text x="116" y="456" text-anchor="middle" font-size="11.5" fill="#5f6368">every few minutes</text>
<rect x="216" y="400" width="152" height="72" rx="8" fill="none" stroke="#b5b2a8" stroke-width="1.25"/>
<text x="292" y="424" text-anchor="middle" font-weight="600" fill="#1f1f1f">Airflow 3</text>
<text x="292" y="440" text-anchor="middle" font-size="11.5" fill="#5f6368">batch inspection</text>
<text x="292" y="456" text-anchor="middle" font-size="11.5" fill="#5f6368">and retraining</text>
<rect x="392" y="400" width="152" height="72" rx="8" fill="none" stroke="#b5b2a8" stroke-width="1.25"/>
<text x="468" y="424" text-anchor="middle" font-weight="600" fill="#1f1f1f">API container</text>
<text x="468" y="440" text-anchor="middle" font-size="11.5" fill="#5f6368">scores, heatmaps,</text>
<text x="468" y="456" text-anchor="middle" font-size="11.5" fill="#5f6368">review queue</text>
<rect x="568" y="400" width="152" height="72" rx="8" fill="none" stroke="#b5b2a8" stroke-width="1.25"/>
<text x="644" y="424" text-anchor="middle" font-weight="600" fill="#1f1f1f">Monitoring</text>
<text x="644" y="440" text-anchor="middle" font-size="11.5" fill="#5f6368">Prometheus and</text>
<text x="644" y="456" text-anchor="middle" font-size="11.5" fill="#5f6368">Grafana, drift</text>
<g fill="none" stroke="#9a978d" stroke-width="1.25">
<path d="M240 116H280" marker-end="url(#arrow)"/>
<path d="M480 116H520" marker-end="url(#arrow)"/>
<path d="M192 276H216" marker-end="url(#arrow)"/>
<path d="M368 276H392" marker-end="url(#arrow)"/>
<path d="M544 276H568" marker-end="url(#arrow)"/>
<path d="M192 436H216" marker-end="url(#arrow)"/>
<path d="M368 436H392" marker-end="url(#arrow)"/>
<path d="M544 436H568" marker-end="url(#arrow)"/>
<path d="M116 168V240" marker-end="url(#arrow)"/>
<path d="M292 400V348H140V312" marker-end="url(#arrow)"/>
</g>
<text x="126" y="194" font-size="11.5" fill="#5f6368">git push: code and dvc.lock</text>
<text x="152" y="341" font-size="11.5" fill="#5f6368">retraining proposal</text>
</svg>
